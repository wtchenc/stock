<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>當沖計算機 Pro</title>
    <!-- 引入 React 和 Babel (鎖定穩定版本以避免最新版的 automatic runtime 產生 import 錯誤) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.8/babel.min.js"></script>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        input { -webkit-appearance: none; border-radius: 0.5rem; }
        /* 隱藏數字輸入框的箭頭 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

<div id="root"></div>

<!-- 強制設定 presets 確保 Babel 正確解析 React -->
<script type="text/babel" data-presets="react">
    /** @jsx React.createElement */
    /** @jsxFrag React.Fragment */
    
    const { useState, useMemo } = React;

    // SVG 圖示組件
    const Icons = {
        ArrowUp: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>,
        ArrowDown: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>,
        Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
        Minus: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/></svg>,
        MoreUp: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m18 15-6-6-6 6"/></svg>,
        MoreDown: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    };

    const App = () => {
        // --- State (統一使用字串管理輸入，避免小數點與開頭 0 問題) ---
        const [tradeMode, setTradeMode] = useState('day'); // 'day' (當沖) or 'overnight' (隔日沖)
        const [tradeType, setTradeType] = useState('long'); // 'long' (做多) or 'short' (做空)
        const [assetType, setAssetType] = useState('stock'); // 'stock' (個股) or 'etf' (ETF)
        const [feeDiscountStr, setFeeDiscountStr] = useState('2.8');
        const [shortFeeRateStr, setShortFeeRateStr] = useState('0.08'); // 隔日沖融券手續費率 (%)
        const [minFeeStr, setMinFeeStr] = useState('20');
        
        const [entryPriceStr, setEntryPriceStr] = useState('100'); 
        const [sheetsStr, setSheetsStr] = useState('1'); 

        // 試算表顯示檔位範圍 (預設上下各 5 檔)
        const [rangeTop, setRangeTop] = useState(5);    
        const [rangeBottom, setRangeBottom] = useState(-5); 

        // --- Constants ---
        const FEE_RATE = 0.001425; 
        const TAX_RATE_NORMAL = 0.003;
        const TAX_RATE_DAY = 0.0015;
        const TAX_RATE_ETF = 0.001;

        // --- Helpers ---
        const safeEntry = parseFloat(entryPriceStr) || 0;
        const safeSheets = parseInt(sheetsStr, 10) || 0;
        const safeDiscount = parseFloat(feeDiscountStr) || 0;
        const safeShortFeeRate = parseFloat(shortFeeRateStr) || 0;
        const safeMinFee = parseInt(minFeeStr, 10) || 0;
        
        const isOvernight = tradeMode === 'overnight';
        const isOvernightShort = isOvernight && tradeType === 'short';

        const currentTaxRate = assetType === 'etf'
            ? TAX_RATE_ETF
            : (isOvernight ? TAX_RATE_NORMAL : TAX_RATE_DAY);

        const formatMoney = (val) => new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 0 }).format(val);
        const formatPercent = (val) => new Intl.NumberFormat('zh-TW', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(val) + '%';

        // 過濾開頭多餘的零 (如 0112 -> 112，但保留 0.5)
        const handleInputChange = (setter) => (e) => {
            let val = e.target.value;
            if (val.length > 1 && val.startsWith('0') && val.indexOf('.') !== 1) {
                val = val.replace(/^0+/, '');
                if (val === '') val = '0';
            }
            setter(val);
        };

        // 台股官方升降單位 (一般股 6 級距 / ETF 2 級距)
        const getTickSize = (price, type = assetType) => {
            if (type === 'etf') {
                return price < 50 ? 0.01 : 0.05;
            }
            if (price < 10) return 0.01;
            if (price < 50) return 0.05;
            if (price < 100) return 0.1;
            if (price < 500) return 0.5;
            if (price < 1000) return 1;
            return 5;
        };

        // 依照級距格式化價格小數位數 (例如 20.1 -> 20.10)
        const formatPrice = (price) => {
            if (typeof price !== 'number' || isNaN(price)) return '-';
            const tick = getTickSize(price, assetType);
            if (tick < 0.1) return price.toFixed(2);
            if (tick < 1) return price.toFixed(1);
            return price.toFixed(0);
        };

        // 以整數「分」進行檔位加減，消除浮點數誤差並精準處理跨級距邊界
        const addTicks = (price, ticks, type = assetType) => {
            let pCents = Math.round(price * 100);
            const direction = ticks > 0 ? 1 : -1;
            let count = Math.abs(ticks);
            
            let safety = 0;
            while (count > 0 && safety < 1000) {
                let stepCents;
                if (type === 'etf') {
                    stepCents = direction > 0
                        ? (pCents < 5000 ? 1 : 5)
                        : (pCents <= 5000 ? 1 : 5);
                } else {
                    if (direction > 0) {
                        if (pCents < 1000) stepCents = 1;
                        else if (pCents < 5000) stepCents = 5;
                        else if (pCents < 10000) stepCents = 10;
                        else if (pCents < 50000) stepCents = 50;
                        else if (pCents < 100000) stepCents = 100;
                        else stepCents = 500;
                    } else {
                        if (pCents <= 1000) stepCents = 1;
                        else if (pCents <= 5000) stepCents = 5;
                        else if (pCents <= 10000) stepCents = 10;
                        else if (pCents <= 50000) stepCents = 50;
                        else if (pCents <= 100000) stepCents = 100;
                        else stepCents = 500;
                    }
                }
                
                pCents += stepCents * direction;
                if (pCents <= 0) break;
                
                count--;
                safety++;
            }
            return pCents <= 0 ? 0 : pCents / 100;
        };

        // 計算單筆交易淨損益與報酬率
        const calculateResult = (entry, exit, vol, type) => {
            if (!entry || !exit || !vol) return { netProfit: 0, roi: 0 };
            
            const buyPrice = type === 'long' ? entry : exit;
            const sellPrice = type === 'long' ? exit : entry;
            
            // 使用 Math.round 避免浮點數誤差 (如 1.15 * 1000 = 1149.9999999999998)
            const buyCost = Math.round(buyPrice * vol);
            const sellRevenue = Math.round(sellPrice * vol);

            let bFee = Math.floor(buyCost * FEE_RATE * (safeDiscount / 10) + 1e-9);
            if (bFee < safeMinFee) bFee = safeMinFee;

            let sFee = Math.floor(sellRevenue * FEE_RATE * (safeDiscount / 10) + 1e-9);
            if (sFee < safeMinFee) sFee = safeMinFee;

            const tax = Math.floor(sellRevenue * currentTaxRate + 1e-9);

            // 隔日沖做空需加計融券手續費 (一般為賣出金額的 0.08%)
            const shortFee = (tradeMode === 'overnight' && type === 'short')
                ? Math.floor(sellRevenue * (safeShortFeeRate / 100) + 1e-9)
                : 0;
            
            const finalSellPocket = sellRevenue - sFee - tax - shortFee; 
            const finalBuyPay = buyCost + bFee; 
            const netProfit = finalSellPocket - finalBuyPay;
            
            const investmentCost = Math.round(entry * vol) + (type === 'long' ? bFee : (sFee + tax + shortFee));
            const roi = investmentCost > 0 ? (netProfit / investmentCost) * 100 : 0;

            return { netProfit, roi };
        };

        // 計算保本價
        const calculateBreakEven = () => {
            if (!safeEntry || !safeSheets) return '-';
            let tempExit = safeEntry;
            const direction = tradeType === 'long' ? 1 : -1;
            for (let i = 0; i < 200; i++) {
                const res = calculateResult(safeEntry, tempExit, safeSheets * 1000, tradeType);
                if (res.netProfit >= 0) return tempExit;
                tempExit = addTicks(tempExit, 1 * direction, assetType);
            }
            return safeEntry;
        };

        // --- Memos ---
        const breakEvenPrice = useMemo(
            () => calculateBreakEven(),
            [safeEntry, safeSheets, tradeMode, tradeType, assetType, safeDiscount, safeShortFeeRate, safeMinFee]
        );

        const simulationTable = useMemo(() => {
            if (!safeEntry || !safeSheets) return [];
            
            const rows = [];
            for (let i = rangeTop; i >= rangeBottom; i--) {
                const direction = tradeType === 'long' ? 1 : -1;
                const p = addTicks(safeEntry, i * direction, assetType);
                
                if (p <= 0) continue;
                
                const res = calculateResult(safeEntry, p, safeSheets * 1000, tradeType);
                rows.push({
                    price: p,
                    diffTick: i,
                    ...res
                });
            }
            return rows;
        }, [safeEntry, safeSheets, tradeMode, tradeType, assetType, safeDiscount, safeShortFeeRate, safeMinFee, rangeTop, rangeBottom]);

        const isLong = tradeType === 'long';

        const getProfitColor = (val) => {
            if (val > 0) return 'text-red-600 font-bold';
            if (val < 0) return 'text-green-600 font-bold';
            return 'text-gray-400';
        };

        const getProfitBg = (val) => {
            if (val > 0) return 'bg-red-50';
            if (val < 0) return 'bg-green-50';
            return 'bg-white';
        };

        // --- Handlers ---
        const handleExpandTop = () => setRangeTop(prev => prev + 5);
        const handleExpandBottom = () => setRangeBottom(prev => prev - 5);

        return (
            <div className="min-h-screen pb-20 max-w-lg mx-auto bg-gray-50 shadow-2xl overflow-hidden border-x border-gray-200">
                
                {/* Header Area */}
                <div className="bg-white p-4 shadow-sm sticky top-0 z-10">
                    <div className="flex items-center justify-between mb-3">
                        <div className="flex items-center gap-2">
                            <div className={`p-1.5 rounded-lg ${isLong ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}`}>
                                {isLong ? <Icons.ArrowUp /> : <Icons.ArrowDown />}
                            </div>
                            <h1 className="font-bold text-gray-800 text-lg">{isOvernight ? '隔日沖試算' : '當沖試算'}</h1>
                        </div>
                        <div className="flex items-center gap-2">
                            <div className="flex bg-gray-100 p-1 rounded-lg">
                                <button onClick={() => setAssetType('stock')} className={`px-2.5 py-1.5 rounded-md text-xs font-bold transition-all ${assetType === 'stock' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-400'}`}>個股</button>
                                <button onClick={() => setAssetType('etf')} className={`px-2.5 py-1.5 rounded-md text-xs font-bold transition-all ${assetType === 'etf' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-400'}`}>ETF</button>
                            </div>
                            <div className="flex bg-gray-100 p-1 rounded-lg">
                                <button onClick={() => setTradeType('long')} className={`px-3 py-1.5 rounded-md text-xs font-bold transition-all ${isLong ? 'bg-white text-red-600 shadow-sm' : 'text-gray-400'}`}>做多</button>
                                <button onClick={() => setTradeType('short')} className={`px-3 py-1.5 rounded-md text-xs font-bold transition-all ${!isLong ? 'bg-white text-green-600 shadow-sm' : 'text-gray-400'}`}>做空</button>
                            </div>
                        </div>
                    </div>

                    {/* Quick Input Row */}
                    <div className="flex gap-3">
                        <div className="flex-1">
                            <div className="flex items-center justify-between mb-1">
                                <label className={`text-xs font-bold ${isLong ? 'text-red-700' : 'text-green-700'}`}>成本價</label>
                                {safeEntry > 0 && (
                                    <span className="text-[10px] text-gray-400 font-mono">1檔={getTickSize(safeEntry, assetType)}</span>
                                )}
                            </div>
                            <input 
                                type="number" step="any" inputMode="decimal"
                                value={entryPriceStr} 
                                onChange={handleInputChange(setEntryPriceStr)} 
                                placeholder="請輸入"
                                className={`w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-2xl font-mono font-bold outline-none focus:ring-2 ${isLong ? 'focus:ring-red-200' : 'focus:ring-green-200'}`}
                            />
                        </div>
                        <div className="w-1/3">
                            <label className="text-xs font-bold text-gray-500 block mb-1">張數</label>
                            <div className="relative">
                                <input 
                                    type="number" step="1" inputMode="numeric"
                                    value={sheetsStr} 
                                    onChange={handleInputChange(setSheetsStr)} 
                                    className="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xl font-mono text-center outline-none focus:ring-2 focus:ring-blue-100"
                                />
                                <div className="absolute right-0 top-0 h-full flex flex-col border-l border-gray-200">
                                    <button onClick={() => setSheetsStr(String(safeSheets + 1))} className="flex-1 px-1.5 hover:bg-gray-200 text-gray-500"><Icons.Plus /></button>
                                    <button onClick={() => setSheetsStr(String(Math.max(1, safeSheets - 1)))} className="flex-1 px-1.5 hover:bg-gray-200 text-gray-500"><Icons.Minus /></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                {/* Mode Switch & Settings Bar */}
                <div className="px-4 py-2.5 space-y-2 text-xs text-gray-500 bg-white border-b border-gray-100">
                    {/* 當沖 / 隔日沖 切換 */}
                    <div className="grid grid-cols-2 gap-1.5 bg-gray-100 p-1 rounded-lg">
                        <button
                            onClick={() => setTradeMode('day')}
                            className={`py-1.5 rounded-md font-bold transition-all ${!isOvernight ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                        >
                            當沖 <span className="font-normal opacity-75">({assetType === 'etf' ? '稅0.1%' : '稅0.15%'})</span>
                        </button>
                        <button
                            onClick={() => setTradeMode('overnight')}
                            className={`py-1.5 rounded-md font-bold transition-all ${isOvernight ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                        >
                            隔日沖 <span className="font-normal opacity-75">({assetType === 'etf' ? '稅0.1%' : '稅0.3%'})</span>
                        </button>
                    </div>

                    <div className="grid grid-cols-12 gap-2">
                        <div className="col-span-4 flex items-center gap-1 bg-gray-50 px-2 py-1.5 rounded">
                            <span>折數</span>
                            <input type="number" step="0.1" value={feeDiscountStr} onChange={handleInputChange(setFeeDiscountStr)} className="w-full bg-transparent text-center font-bold text-gray-700 outline-none" />
                        </div>
                        <div className="col-span-4 flex items-center justify-center gap-1 bg-gray-50 px-2 py-1.5 rounded">
                            {isOvernightShort ? (
                                <div className="flex items-center gap-1 w-full">
                                    <span className="whitespace-nowrap text-indigo-600 font-bold">券費%</span>
                                    <input type="number" step="0.01" value={shortFeeRateStr} onChange={handleInputChange(setShortFeeRateStr)} className="w-full bg-transparent text-center font-bold text-indigo-700 outline-none" />
                                </div>
                            ) : (
                                <span className="font-bold text-gray-600">
                                    {assetType === 'etf' ? 'ETF稅 0.1%' : (isOvernight ? '一般稅 0.3%' : '當沖稅 0.15%')}
                                </span>
                            )}
                        </div>
                        <div className="col-span-4 flex flex-col justify-center items-center bg-yellow-50 text-yellow-800 rounded px-1 py-1.5 font-bold">
                            <span>保本: {typeof breakEvenPrice === 'number' ? formatPrice(breakEvenPrice) : breakEvenPrice}</span>
                        </div>
                    </div>
                </div>

                {/* Main Table */}
                <div className="bg-white">
                    {/* Expand Top Button Area */}
                    <div className="flex border-b border-gray-100">
                        {rangeTop > 5 && (
                            <button 
                                onClick={() => setRangeTop(5)}
                                className="w-24 py-3 text-xs text-gray-400 font-medium bg-gray-50 hover:bg-gray-100 border-r border-gray-200 transition-colors"
                            >
                                收合
                            </button>
                        )}
                        <button 
                            onClick={handleExpandTop}
                            className="flex-1 py-3 text-xs text-blue-500 font-medium bg-blue-50/50 hover:bg-blue-50 flex items-center justify-center gap-1 transition-colors"
                        >
                            <Icons.MoreUp /> {isLong ? '查看更高價位 (+5)' : '查看更低價位 (獲利 +5)'}
                        </button>
                    </div>

                    <div className="w-full">
                        <div className="grid grid-cols-4 text-xs text-gray-400 border-b py-2 px-4 bg-gray-50/80 sticky top-[154px]">
                            <div className="text-left">檔位</div>
                            <div className="text-right">{isLong ? '賣出價' : '回補價'}</div>
                            <div className="text-right">損益</div>
                            <div className="text-right">報酬率</div>
                        </div>
                        
                        <div className="divide-y divide-gray-100">
                            {simulationTable.length === 0 ? (
                                <div className="py-8 text-center text-gray-400 text-sm">請輸入有效數值以查看試算表</div>
                            ) : simulationTable.map((row) => (
                                <div key={row.diffTick} className={`grid grid-cols-4 py-2.5 px-4 items-center transition-colors ${row.diffTick === 0 ? 'bg-blue-50 ring-1 ring-blue-100 z-10 relative' : getProfitBg(row.netProfit)} ${row.price === breakEvenPrice && row.diffTick !== 0 ? 'bg-yellow-50' : ''}`}>
                                    
                                    {/* Column 1: Tick Label */}
                                    <div className="text-left">
                                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                            row.diffTick > 0 ? 'bg-red-100 text-red-600' : 
                                            row.diffTick < 0 ? 'bg-green-100 text-green-600' : 
                                            'bg-blue-600 text-white'
                                        }`}>
                                            {row.diffTick === 0 ? '成本' : row.diffTick > 0 ? `+${row.diffTick}` : row.diffTick}
                                        </span>
                                        {row.price === breakEvenPrice && row.diffTick !== 0 && <span className="ml-1 text-[9px] text-yellow-600 font-bold border border-yellow-200 px-1 rounded bg-white">保本</span>}
                                    </div>

                                    {/* Column 2: Price */}
                                    <div className={`text-right font-mono font-medium text-base ${isLong ? 'text-gray-800' : 'text-blue-900'}`}>
                                        {formatPrice(row.price)}
                                    </div>

                                    {/* Column 3: Net Profit */}
                                    <div className={`text-right font-mono text-base ${getProfitColor(row.netProfit)}`}>
                                        {row.netProfit > 0 ? '+' : ''}{formatMoney(row.netProfit)}
                                    </div>

                                    {/* Column 4: ROI */}
                                    <div className={`text-right font-mono text-xs ${getProfitColor(row.roi)}`}>
                                        {formatPercent(row.roi)}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Expand Bottom Button Area */}
                    <div className="flex border-t border-gray-100 mb-8">
                        {rangeBottom < -5 && (
                            <button 
                                onClick={() => setRangeBottom(-5)}
                                className="w-24 py-4 text-xs text-gray-400 font-medium bg-gray-50 hover:bg-gray-100 border-r border-gray-200 transition-colors"
                            >
                                收合
                            </button>
                        )}
                        <button 
                            onClick={handleExpandBottom}
                            className="flex-1 py-4 text-xs text-blue-500 font-medium bg-blue-50/50 hover:bg-blue-50 flex items-center justify-center gap-1 transition-colors"
                        >
                            <Icons.MoreDown /> {isLong ? '查看更低價位 (+5)' : '查看更高價位 (虧損 +5)'}
                        </button>
                    </div>
                </div>

                <div className="text-center text-[10px] text-gray-300 py-4 bg-gray-50">
                    當沖／隔日沖計算機 Pro v2.6 (支援隔日沖稅率與融券費)
                </div>

            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
